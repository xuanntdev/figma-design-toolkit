<script>
  // Chỉ đọc khi có yêu cầu từ CLI. Giãn nhịp hỏi khi cầu nối localhost chưa chạy.
  const BRIDGE_URL = 'http://localhost:__BRIDGE_PORT__';
  const BRIDGE_POLL_MS = 3000;
  const BRIDGE_MAX_MS = 10000;
  let bridgeBusy = false;
  let bridgeDelay = BRIDGE_POLL_MS;
  let bridgeLast = null;
  const bridgeLine = document.createElement('div');
  bridgeLine.className = 'st';
  bridgeLine.setAttribute('role', 'status');

  function clock(d) {
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  function showBridge(connected) {
    bridgeLine.textContent = connected
      ? (bridgeLast ? 'Đã đọc lúc ' + clock(bridgeLast) : 'Đã kết nối · chờ yêu cầu đọc')
      : 'Chờ kết nối cục bộ';
  }

  async function bridgeCall(method, path, body) {
    const init = { method };
    if (body) {
      init.body = JSON.stringify(body);
      init.headers = { 'Content-Type': 'text/plain;charset=UTF-8' }; // yêu cầu "đơn giản": không cần preflight
    }
    const res = await fetch(BRIDGE_URL + path, init);
    return res.json();
  }

  // Trả kết quả kèm mã yêu cầu để CLI nhận đúng lần đọc.
  async function bridgeSend(requestId) {
    let payload;
    try {
      payload = await callMain('readState', { requestId }, 3600000);
    } catch (err) {
      return bridgeCall('POST', '/state', { kind: 'figma-state', requestId, error: err.message });
    }
    const res = await bridgeCall('POST', '/state', payload);
    if (res.ok) bridgeLast = new Date();
    return res;
  }

  async function bridgePoll() {
    if (!bridgeBusy && inflight === 0) {
      try {
        const r = await bridgeCall('GET', '/pending');
        bridgeDelay = BRIDGE_POLL_MS;
        if (r.pending) {
          bridgeBusy = true;
          bridgeLine.textContent = 'Đang đọc trạng thái…';
          await bridgeSend(r.pending.id);
          bridgeBusy = false;
        }
        showBridge(true);
      } catch (err) {
        bridgeBusy = false;
        bridgeDelay = Math.min(bridgeDelay * 2, BRIDGE_MAX_MS);
        showBridge(false);
      }
    }
    setTimeout(bridgePoll, bridgeDelay);
  }

  document.getElementById('st').after(bridgeLine);
  showBridge(false);
  bridgePoll();
</script>
