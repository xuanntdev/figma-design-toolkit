<script>
  const LIVE_URL = 'http://localhost:__BRIDGE_PORT__/live/';
  const LIVE_KEY = '__BRIDGE_KEY__';
  const LIVE_RECONNECT_DELAY = 2500;
  // Lệnh treo không giữ cả phiên: quá hạn thì báo lỗi rồi nhận lệnh tiếp. Đọc trọn file được lâu hơn.
  const LIVE_TIMEOUT = 120000;
  const LIVE_STATE_TIMEOUT = 3600000;
  const liveCommands = Object.freeze({
    state: 'readState', selection: 'liveSelection', tree: 'liveTree', find: 'liveFind', lint: 'liveLint', exportPng: 'exportPng',
    impact: 'liveImpact', edit: 'liveEdit', create: 'liveCreate',
    protect: 'liveProtect', stage: 'liveStage',
  });
  let liveSession = null;
  let liveBusy = false;
  let liveTouching = false;
  let liveWantConnection = true;
  let liveNextAttach = 0;
  let liveBatch = null;
  const liveLine = document.createElement('div');
  const liveStatus = document.createElement('span');
  const liveConnect = document.createElement('button');
  const liveDiscard = document.createElement('button');
  liveLine.className = 'st';
  liveStatus.setAttribute('role', 'status');
  liveConnect.textContent = 'Kết nối file';
  liveDiscard.textContent = 'Bỏ lượt chờ';
  liveDiscard.hidden = true;
  liveLine.append(liveConnect, ' ', liveStatus, ' ', liveDiscard);
  document.getElementById('st').after(liveLine);

  async function liveCall(path, data) {
    const init = { headers: { 'X-Design-Sync-Key': LIVE_KEY }, method: data ? 'POST' : 'GET' };
    if (data) init.body = JSON.stringify(data);
    const response = await fetch(LIVE_URL + path, init);
    const payload = await response.json();
    if (!response.ok) {
      const error = new Error(payload.error || 'Cầu nối không trả lời.');
      error.code = payload.code;
      throw error;
    }
    return payload;
  }

  function livePost(path, data) {
    return liveCall(path, { ...data, session: liveSession.id });
  }

  function liveClear() {
    if (!readOnly && liveBatch) {
      renderPlan(cachedCat);
      setStatus('');
    }
    liveSession = liveBatch = null;
    liveDiscard.hidden = true;
    liveConnect.textContent = 'Kết nối file';
  }

  function liveConnected() {
    const label = 'Đã kết nối · ' + liveSession.file;
    if (liveStatus.textContent !== label) liveStatus.textContent = label;
  }

  async function liveSetConnection(connect, automatic = false) {
    if (liveBusy) return;
    liveBusy = true;
    liveConnect.disabled = true;
    try {
      if (!connect) {
        await livePost('detach', {});
        liveClear();
        liveStatus.textContent = 'Đã ngắt kết nối';
      } else {
        liveSession = await liveCall('attach', await callMain('liveFile', {}));
        liveConnect.textContent = 'Ngắt kết nối';
        liveConnected();
      }
    } catch (err) {
      if (err.code === 'session_changed') liveClear();
      if (automatic && err.code === 'session_in_use') {
        liveStatus.textContent = 'Đang chờ phiên ở cửa sổ plugin khác.';
      } else if (automatic && err instanceof TypeError) {
        liveStatus.textContent = 'Đang chờ cầu nối.';
      } else {
        liveStatus.textContent = err.message;
      }
    } finally {
      liveNextAttach = Date.now() + LIVE_RECONNECT_DELAY;
      liveBusy = false;
      liveConnect.disabled = false;
    }
  }

  liveConnect.onclick = () => {
    if (liveBusy) return;
    liveWantConnection = !liveSession;
    return liveSetConnection(liveWantConnection);
  };

  function liveFormatDetails(details) {
    const list = Array.isArray(details) ? details : [];
    const MAX_ITEMS = 4;
    if (list.length <= MAX_ITEMS) return list.join(' · ');
    return list.slice(0, MAX_ITEMS).join(' · ') + ' … (+' + (list.length - MAX_ITEMS) + ' mục)';
  }

  function liveToRows(rows, badge = '') {
    return rows.map((row) => {
      const count = Array.isArray(row.details) ? row.details.length : 0;
      return {
        title: row.page + ' · ' + row.screen,
        desc: liveFormatDetails(row.details),
        badge: badge || (row.inherited && count === 1 ? 'Kế thừa' : (count > 1 ? count + ' mục' : '')),
      };
    });
  }

  function liveRender(batch) {
    if (readOnly) return;
    const { changes, blocked, overridden = [] } = batch.preview;
    renderRows([...liveToRows(changes), ...liveToRows(blocked, 'Cấm ghi'), ...liveToRows(overridden, 'Giữ override')]);
    btnUpdate.hidden = false;
    liveDiscard.hidden = false;
    setStatus('Bấm Cập nhật để áp dụng lượt sửa.');
  }

  function liveRenderDone(preview, changed) {
    if (readOnly || !preview) return;
    const { changes = [], blocked = [], overridden = [] } = preview;
    const summary = {
      title: 'Đã cập nhật ' + changed + ' layer trên ' + changes.length + ' màn',
      badge: '✓ Xong',
      desc: blocked.length || overridden.length
        ? [blocked.length ? blocked.length + ' cấm ghi' : '', overridden.length ? overridden.length + ' giữ override' : ''].filter(Boolean).join(' · ')
        : '',
    };
    renderRows([summary, ...liveToRows(changes, '✓'), ...liveToRows(blocked, 'Cấm ghi')]);
  }

  async function liveRun(job) {
    let output;
    try {
      if (!Object.hasOwn(liveCommands, job.command)) throw new Error('Lệnh cầu nối không được hỗ trợ.');
      const wait = job.command === 'state' ? LIVE_STATE_TIMEOUT : LIVE_TIMEOUT;
      output = { result: await callMain(liveCommands[job.command], { ...job.args, jobId: job.id }, wait) };
    } catch (err) {
      output = { error: err.message };
    }
    await livePost('result/' + job.id, output);
    if (!output.error && job.command === 'stage' && output.result.changes.length) {
      liveBatch = { id: job.id, preview: output.result };
      liveRender(liveBatch);
    }
  }

  async function livePoll() {
    if (!liveSession) {
      if (liveWantConnection && !inflight && Date.now() >= liveNextAttach) {
        await liveSetConnection(true, true);
      }
      return;
    }
    const session = liveSession;
    try {
      if (liveBusy || inflight) {
        if (liveTouching) return;
        liveTouching = true;
        try {
          await livePost('touch', {});
          if (liveSession === session) liveConnected();
        } finally {
          liveTouching = false;
        }
        return;
      }
      liveBusy = true;
      try {
        const { job, batch } = await livePost('poll', {});
        liveConnected();
        if (batch?.state === 'ready' && liveBatch?.id !== batch.id) {
          liveBatch = batch;
          liveRender(batch);
        }
        if (job) await liveRun(job);
      } finally {
        liveBusy = false;
      }
    } catch (err) {
      if (liveSession !== session) return;
      if (err.code === 'session_changed') {
        liveClear();
        liveStatus.textContent = err.message;
      } else {
        liveStatus.textContent = 'Đang thử kết nối lại · ' + err.message;
      }
    }
  }

  liveDiscard.onclick = async () => {
    if (!liveBatch || liveBusy) return;
    liveBusy = true;
    try {
      await livePost('batch/discard', { id: liveBatch.id });
      liveBatch = null;
      liveDiscard.hidden = true;
      renderPlan(cachedCat);
      setStatus('Đã bỏ lượt chờ cập nhật.');
    } catch (err) {
      setStatus(err.message, 'err');
    } finally {
      liveBusy = false;
    }
  };

  function liveHandleUpdate() {
    if (liveBusy) return true;
    if (!liveBatch) return false;
    liveApply();
    return true;
  }

  async function liveApply() {
    const id = liveBatch.id;
    const preview = liveBatch.preview;
    liveBusy = true;
    btnUpdate.disabled = true;
    try {
      await livePost('batch/begin', { id });
      let output;
      try {
        output = { result: await callMain('liveApply', { jobId: id }) };
      } catch (err) {
        output = { error: err.message };
      }
      await livePost('batch/finish', { id, ...output });
      if (output.error) {
        setStatus(output.error, 'err');
      } else {
        liveRenderDone(preview, output.result.changed);
        setStatus('Đã cập nhật ' + output.result.changed + ' layer.', 'ok');
      }
    } catch (err) {
      setStatus(err.message, 'err');
    } finally {
      liveBatch = null;
      liveBusy = false;
      liveDiscard.hidden = true;
      btnUpdate.hidden = true;
      btnUpdate.disabled = false;
    }
  }

  setInterval(livePoll, 700);
  window.addEventListener('pagehide', () => {
    if (!liveSession || liveBusy) return;
    fetch(LIVE_URL + 'detach', {
      method: 'POST', headers: { 'X-Design-Sync-Key': LIVE_KEY },
      body: JSON.stringify({ session: liveSession.id }), keepalive: true,
    }).catch(() => {});
  });
</script>
