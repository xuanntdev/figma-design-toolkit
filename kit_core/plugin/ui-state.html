<script>
  // Đọc trạng thái file Figma (trang, Section, khung màn + trạng thái, token, component) và tải thành một tệp JSON.
  // Đưa vào repo bằng: python design_sync.py import-state <tệp>. Không cần mạng.
  function downloadJson(name, data) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function stateSummary(payload) {
    const c = payload.files['index.json'].counts;
    return c.screens + ' màn (sửa tay ' + c.edited + ', vẽ tay ' + c.handmade + ')';
  }

  async function runStateExport(btn) {
    btn.disabled = true;
    setStatus('Đang đọc file Figma…');
    try {
      const payload = await callMain('readState', {});
      const name = 'figma-state-' + new Date().toISOString().slice(0, 10) + '.json';
      downloadJson(name, payload);
      setStatus('Đã xuất ' + stateSummary(payload) + '. Chạy: python design_sync.py import-state ' + name, 'ok');
    } catch (err) {
      setStatus('Lỗi: ' + err.message, 'err');
    } finally {
      btn.disabled = false;
    }
  }

  (function initStateExport() {
    const btn = el('button', 'btn-secondary', 'Xuất trạng thái');
    btn.title = 'Tải JSON mô tả file Figma (màn, token, component) để nạp vào repo bằng import-state';
    btn.onclick = () => runStateExport(btn);
    document.querySelector('.actions').appendChild(btn);
  })();
</script>
